{% extends "brand/auth.html" %}

{% block title %}Portal da frota{% endblock %}

{% block auth_head %}
<h1 class="lf-page-title">Portal da frota</h1>
<p class="lf-page-subtitle mb-5">Entre com a conta da sua frota.</p>
{% endblock %}

{% block auth_body %}
<form method="post" class="space-y-4">
  {% csrf_token %}
  <label class="lf-field"><span class="lf-label">Utilizador ou email</span>
    <input type="text" name="username" autocomplete="username" required autofocus class="lf-control"></label>
  <label class="lf-field"><span class="lf-label">Palavra-passe</span>
    <input type="password" name="password" autocomplete="current-password" required class="lf-control"></label>
  <button type="submit" class="lf-btn lf-btn-primary w-full">Entrar</button>
</form>
<p class="mt-5 text-center text-xs text-gray-500 dark:text-gray-400">
  <a class="underline" href="{% url 'customauth:login' %}">Gestão</a> · <a class="underline" href="{% url 'customauth:driver_login' %}">Portal do motorista</a>
</p>
{% endblock %}
