{% extends "brand/auth.html" %}

{% block title %}Entrar{% endblock %}

{% block auth_head %}
<h1 class="lf-page-title">Entrar</h1>
<p class="lf-page-subtitle mb-5">Use a conta de gestão.</p>
{% endblock %}

{% block auth_body %}
<form method="post" class="space-y-4">
  {% csrf_token %}
  <label class="lf-field"><span class="lf-label">Email ou NIF</span>
    <input id="email_or_nif" name="email_or_nif" type="text" autocomplete="username" required autofocus class="lf-control"></label>
  <label class="lf-field"><span class="lf-label">Palavra-passe</span>
    <input id="password" name="password" type="password" autocomplete="current-password" required class="lf-control"></label>
  <button type="submit" class="lf-btn lf-btn-primary w-full">Entrar</button>
</form>
<p class="mt-5 text-center text-xs text-gray-500 dark:text-gray-400">
  <a class="underline" href="{% url 'customauth:driver_login' %}">Portal do motorista</a> · <a class="underline" href="{% url 'customauth:empresa_login' %}">Portal da frota</a>
</p>
{% endblock %}
