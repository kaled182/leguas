{% comment %}
Toasts do portal. confirm/prompt usam o modal da marca (static/brand/ui.js).
Inclui em ambos layouts (admin sidebar + driver clean).
{% endcomment %}
{# O Alpine vem do shell ou de brand/portal.html. #}
<div x-data="appUi">
  {# ─── Toasts (canto inferior direito) ─── #}
  <div class="fixed bottom-6 right-6 z-[400] space-y-2 pointer-events-none">
    <template x-for="t in toasts" :key="t.id">
      <div x-show="t.visible" x-transition.duration.300ms
           class="pointer-events-auto min-w-[280px] max-w-md shadow-xl rounded-xl px-4 py-3 flex items-start gap-3 border"
           :class="{
             'bg-emerald-50 border-emerald-300 text-emerald-800': t.type === 'success',
             'bg-rose-50 border-rose-300 text-rose-800': t.type === 'error',
             'bg-amber-50 border-amber-300 text-amber-800': t.type === 'warning',
             'bg-blue-50 border-blue-300 text-blue-800': t.type === 'info'
           }">
        <i :data-lucide="t.icon" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
        <div class="flex-1 text-sm">
          <p x-show="t.title" class="font-semibold mb-0.5" x-text="t.title"></p>
          <p x-text="t.message"></p>
        </div>
        <button @click="dismissToast(t.id)" class="flex-shrink-0 opacity-60 hover:opacity-100">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </template>
  </div>

</div>

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('appUi', () => ({
      toasts: [],
      nextId: 1,
      showToast(opts) {
        const id = this.nextId++;
        const t = {
          id, visible: true,
          type: opts.type || 'info',
          title: opts.title || '',
          message: opts.message || '',
          icon: opts.icon || (
            opts.type === 'success' ? 'check-circle' :
            opts.type === 'error' ? 'x-circle' :
            opts.type === 'warning' ? 'alert-triangle' : 'info'
          ),
        };
        this.toasts.push(t);
        this.$nextTick(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); });
        setTimeout(() => this.dismissToast(id), opts.duration || 5000);
      },
      dismissToast(id) {
        const t = this.toasts.find(x => x.id === id);
        if (t) {
          t.visible = false;
          setTimeout(() => { this.toasts = this.toasts.filter(x => x.id !== id); }, 300);
        }
      },
      // O modal é o da marca (static/brand/ui.js).
      confirm(opts) {
        return window.lfConfirm(opts.message || opts.title, {
          title: opts.message ? opts.title : '',
          confirmLabel: opts.confirmText,
          danger: opts.type === 'danger' ? true : undefined,
        });
      },
      prompt(opts) {
        return window.lfPrompt(opts.message || opts.title, opts.default || '', {
          title: opts.message ? opts.title : '',
          confirmLabel: opts.confirmText,
        });
      },
    }));

    // Helpers globais (utilizados em qualquer página do portal)
    window.appUi = () => Alpine.$data(document.querySelector('[x-data="appUi"]'));
    window.toast = (opts) => window.appUi().showToast(opts);
    window.confirmModal = (opts) => window.appUi().confirm(opts);
    window.promptModal = (opts) => window.appUi().prompt(opts);
  });
</script>
