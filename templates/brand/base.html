{% load static %}<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Léguas Gestão{% endblock %} · Léguas Gestão</title>
  <link rel="icon" href="{% static 'brand/favicon.ico' %}" sizes="any">
  <link rel="apple-touch-icon" href="{% static 'brand/apple-touch-icon.png' %}">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;0,700;1,700&display=swap">
  <link rel="stylesheet" href="{% static 'brand/tokens.css' %}?v={{ asset_version }}">
  <link rel="stylesheet" href="{% static 'brand/app.css' %}?v={{ asset_version }}">
  <script>try{if(localStorage.getItem('lf-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
  <script src="https://unpkg.com/lucide@1.65.0/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"></script>
  <script src="{% static 'brand/ui.js' %}?v={{ asset_version }}" defer></script>
  <script src="{% static 'brand/chart-theme.js' %}?v={{ asset_version }}" defer></script>
</head>
<body class="bg-[var(--color-bg)]">
  {% block body %}{% endblock %}
  {% include "components/toast.html" %}
  <script>document.addEventListener('DOMContentLoaded', () => { if (window.lucide) lucide.createIcons(); });</script>
  {% block scripts %}{% endblock %}
</body>
</html>
