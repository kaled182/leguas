{# label, variant (primary|secondary|ghost|danger), url, modal, icon, type, disabled, aria_label #}
{% if url %}<a class="lf-btn lf-btn-{{ variant|default:'ghost' }}" href="{{ url }}"{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}>{% if icon %}<i data-lucide="{{ icon }}" class="w-4 h-4" aria-hidden="true"></i>{% endif %}{{ label }}</a>{% else %}<button class="lf-btn lf-btn-{{ variant|default:'ghost' }}" type="{{ type|default:'button' }}"{% if modal %} data-modal-open="{{ modal }}"{% endif %}{% if disabled %} disabled{% endif %}{% if aria_label %} aria-label="{{ aria_label }}"{% endif %}>{% if icon %}<i data-lucide="{{ icon }}" class="w-4 h-4" aria-hidden="true"></i>{% endif %}{{ label }}</button>{% endif %}
